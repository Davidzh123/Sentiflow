upstream api_backend {
    server api:8000;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /auth/ {
        proxy_pass http://api_backend/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /targets/ {
        proxy_pass http://api_backend/targets/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /tweets/ {
        proxy_pass http://api_backend/tweets/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /analysis/ {
        proxy_pass http://api_backend/analysis/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /alerts/ {
        proxy_pass http://api_backend/alerts/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /twitter/ {
        proxy_pass http://api_backend/twitter/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /tasks/ {
        proxy_pass http://api_backend/tasks/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /llm/ {
        proxy_pass http://api_backend/llm/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 240s;
    }

    location /dashboards/ {
        proxy_pass http://api_backend/dashboards/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /feedback/ {
        proxy_pass http://api_backend/feedback/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /rag/ {
        proxy_pass http://api_backend/rag/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://api_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /admin/ {
        proxy_pass http://api_backend/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

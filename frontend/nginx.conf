server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API routes must be proxied to FastAPI. Without /feedback here,
    # Nginx handles POST /feedback/llm as a static-file request and returns 405.
    location ~ ^/(auth|targets|tweets|analysis|alerts|twitter|tasks|llm|dashboards|feedback|health)(/|$) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
